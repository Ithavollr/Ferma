# Fully Frozen Pack - ALL parameters clamped to frozen values
# This should produce a world with ONLY frozen biomes (snow, ice)

id: fully_frozen
name: "Fully Frozen"
description: "All climate parameters clamped to frozen values - only snow/ice biomes"

climate:
  # Frozen temperature (-1.0 = always frozen)
  temperature:
    type: constant
    value: -1.0
  
  # Low humidity (dry) to avoid swamps in frozen areas
  humidity:
    type: constant
    value: -0.5
  
  # Mid continentalness (inland but not extreme)
  continentalness:
    type: constant
    value: 0.0
  
  # Low erosion (flat terrain)
  erosion:
    type: constant
    value: -0.5
  
  # Mid weirdness
  weirdness:
    type: constant
    value: 0.0
  
  # Standard depth
  depth:
    type: y_clamped_gradient
    min_y: -64
    max_y: 320
