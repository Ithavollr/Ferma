schema_version: 1
id: ice_island
name: "Ice Island"
description: "The frozen throne of Pillowy"
type: noise

climate:
  continentalness:
    # Radial gradient: bidirectional rate-based falloff.
    # Formula: value = clamp(start_value + rate * distance, clamp_min, clamp_max)
    # rate = (target_floor - start) / distance_to_reach_it
    # Here: (-1.05 - 1.0) / 6000 ≈ -0.000342 per block
    # Negative = decreasing with distance (falloff). Positive = increasing (fall-up).
    type: radial_gradient
    center_x: 0
    center_z: 0
    start_value: 1.37       # 1.3 above clamp_max → plateau at 1.0 for 300 blocks
    rate: -0.004            # -0.002 drops 1.0 per 1000 blocks
    clamp_min: -1.04        # deep ocean floor
    clamp_max: 1.0          # far-inland plateau

  erosion:
    type: radial_gradient
    center_x: 0
    center_z: 0
    start_value: -1.2       # -1.3 below clamp_min → plateau at -1.0 for 300 blocks
    rate: 0.004             # 0.002 increases 1.0 per 1000 blocks
    clamp_min: -1.0         # peaks/mountains
    clamp_max: 1.0          # flat plains

  temperature:
    type: radial_gradient
    center_x: 96
    center_z: 91
    start_value: -0.25
    rate: -0.0045
    clamp_min: -1.0
    clamp_max: -0.4

  humidity:
    type: constant
    value: -1.0

    # OTHER USE CASE EXAMPLES (commented out):
    #
    # Fall-up: frozen core, warm rim
    #   start_value: -1.0    # frozen at center
    #   rate: 0.00025        # warm up as you travel outward
    #   clamp_max: 1.0
    #
    # Plateau then drop: set start_value above clamp_max for a flat zone
    #   start_value: 5.0    # way above clamp_max
    #   rate: -0.001
    #   clamp_max: 1.0       # flat plateau until distance > 4000, then drops
    #   clamp_min: -1.0
    #
    # Bullseye band: combine two opposing gradients in a future composer (max/add)
    #   # mountains at 0 and at ~6000 blocks out

    # cherry_grove biome:
    # ===================
    # continentalness: [0.3, 1.0]
    # erosion: [-0.7799, -0.375] or [-0.375, -0.2225]
    # humidity: [-1.0, -0.35] or [-0.35, -0.1]
    # temperature: [-0.45, -0.15] or [-0.15, 0.2]
    # weirdness: [0.2666, 0.4]
    # depth: 0.0 or 1.0

    # ice_spikes biome:
    # =================
    # continentalness: [0.03, 1.0] or [-0.11, 0.03] or [-0.19, -0.11]
    # erosion: [-1.0, -0.375] or [-0.375, 0.05] or [0.05, 0.45] or [0.45, 0.55]
    # humidity: [-1.0, -0.35]
    # temperature: [-1.0, -0.45]
    # weirdness: [-0.05, 0.05] or [0.05, 0.2666]
    # depth: 0.0 or 1.0