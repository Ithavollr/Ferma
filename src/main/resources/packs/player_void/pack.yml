# Void for player worlds
# Minimal start platform + overworld characteristics.

schema_version: 1
id: player_void
name: "Player Void"
description: "A void world with a small platform at spawn"
type: void

palette:
  # Create a 1x1 bedrock platform at spawn
  "[0, 0, 0]": "minecraft:bedrock"

# Biomes are banded by height only (no x/z variation):
#   y -64..-33 lush_caves | -32..-5 ocean | -4..75 plains | 76..127 cherry_grove
#   128..191 snowy_slopes | 192..top frozen_peaks
climate:
  # Constant: temperature cell that gives plains/cherry_grove at the humidity below
  temperature:
    type: constant
    value: 0.0

  # Lush caves need humidity >= 0.7; plains/cherry_grove need it low. Steps between samples.
  humidity:
    type: y_gradient
    from_y: -36
    from_value: 0.8
    to_y: -32
    to_value: -0.2

  # Ocean below y -4, far inland (>= 0.3, needed by cherry_grove) above. Steps between samples.
  continentalness:
    type: y_gradient
    from_y: -8
    from_value: -0.3
    to_y: -4
    to_value: 0.31

  # One erosion value shared by plains, cherry_grove, snowy_slopes and frozen_peaks
  erosion:
    type: constant
    value: -0.5

  # Walks plains (< 0.267) -> cherry_grove (< 0.4) -> snowy_slopes (< 0.567) -> frozen_peaks
  weirdness:
    type: y_gradient
    from_y: 48
    from_value: 0.2
    to_y: 240
    to_value: 0.7
